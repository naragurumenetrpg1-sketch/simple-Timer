<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Focus Timer</title>
<link rel="icon" href="icon-32.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Focus Timer">
<meta name="theme-color" content="#0b0e14">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0e14;
    --bg-soft: #11151f;
    --amber: #ff9f45;
    --teal: #3ddc97;
    --text: #eef1f6;
    --text-dim: #6b7280;
    --ring-track: #1c2230;
    --amber-glow: rgba(255, 159, 69, 0.5);
  }

  /* 追加: 画面の色「白」(背景はそのまま、オレンジの部分だけ白にする) */
  :root[data-accent="white"] {
    --amber: #e0e4ea;
    --amber-glow: rgba(255, 255, 255, 0.3);
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    overscroll-behavior: none;
  }

  body {
    margin: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 50% 20%, #141a26 0%, var(--bg) 60%);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    padding: 1rem;
    overflow: hidden;
    touch-action: none;
  }

  .layout {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
  }

  .col {
    display: flex;
    align-items: center;
  }

  .col-center {
    flex-direction: column;
    order: 1;
  }

  .col-presets {
    flex-direction: row;
    order: 2;
  }

  .col-right {
    flex-direction: column;
    order: 3;
  }

  .eyebrow {
    font-size: 0.75rem;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 1.4rem;
  }

  .timer-wrap {
    position: relative;
    width: min(260px, 70vw, 48vh);
    height: min(260px, 70vw, 48vh);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  svg.ring {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    transform: rotate(-90deg);
  }

  .ring-track {
    fill: none;
    stroke: var(--ring-track);
    stroke-width: 6;
  }

  .ring-progress {
    fill: none;
    stroke: var(--amber);
    stroke-width: 6;
    stroke-linecap: round;
    transition: stroke-dashoffset 1s linear, stroke 0.4s ease;
    filter: drop-shadow(0 0 6px var(--amber-glow));
  }

  .ring-progress.done {
    stroke: var(--teal);
    filter: drop-shadow(0 0 10px rgba(61, 220, 151, 0.7));
  }

  #display {
    font-family: 'Space Grotesk', sans-serif;
    font-size: clamp(1.9rem, 10vmin, 3.4rem);
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.02em;
    z-index: 2;
  }

  @media (max-height: 480px) {
    .eyebrow { margin-bottom: 0.8rem; }
    .timer-wrap { width: min(220px, 60vw, 42vh); height: min(220px, 60vw, 42vh); }
    .col-presets { margin-top: 0.8rem; }
    .col-right { margin-top: 0.8rem; }
    #status { margin-top: 0.8rem; }
  }

  @media (max-width: 380px) {
    .inputs { gap: 1rem; }
    .col-presets { flex-wrap: wrap; justify-content: center; }
    .col-right { flex-wrap: wrap; justify-content: center; }
  }

  #display.pulse {
    animation: pulse 1s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  .inputs {
    display: flex;
    gap: 1rem;
  }

  .field {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.4rem;
  }

  .field label {
    font-size: 0.7rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--text-dim);
  }

  input[type="number"] {
    width: 54px;
    padding: 0.4rem;
    border-radius: 10px;
    border: 1px solid #232a3a;
    background: var(--bg-soft);
    color: var(--text);
    text-align: center;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 1rem;
    outline: none;
  }

  input[type="number"]:focus {
    border-color: var(--amber);
  }

  .col-presets {
    gap: 0.5rem;
    margin-top: 0.9rem;
  }

  .preset {
    padding: 0.15rem 0.7rem;
    border-radius: 999px;
    border: 1px solid #232a3a;
    background: var(--bg-soft);
    color: var(--text-dim);
    font-family: 'Inter', sans-serif;
    font-weight: 500;
    font-size: 0.75rem;
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .preset:hover {
    color: var(--text);
    border-color: var(--amber);
  }

  .preset.active {
    background: var(--amber);
    color: #1a1206;
    border-color: var(--amber);
  }

  .col-right {
    flex-wrap: wrap;
    justify-content: center;
    gap: 0.7rem;
    margin-top: 1.3rem;
  }

  .col-right .inputs {
    margin-bottom: 0;
  }

  .button-row {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 0.7rem;
  }

  button {
    padding: 0.3rem 1.2rem;
    border: none;
    border-radius: 999px;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 0.8rem;
    cursor: pointer;
    transition: transform 0.15s ease, opacity 0.15s ease;
  }

  button:active {
    transform: scale(0.96);
  }

  #startBtn {
    background: var(--amber);
    color: #1a1206;
  }

  #barOpenBtn {
    background: transparent;
    color: var(--text-dim);
    border: 1px solid #232a3a;
  }

  #barOpenBtn:hover {
    color: var(--text);
    border-color: #3a4256;
  }

  #status {
    margin-top: 1.2rem;
    font-size: 0.8rem;
    color: var(--text-dim);
    letter-spacing: 0.02em;
  }

  /* スマホの横向き(画面の高さが低い場合のみ発火、PCの横長ウィンドウでは発火しない) */
  @media (orientation: landscape) and (max-height: 500px) {
    .layout {
      flex-direction: row;
      align-items: center;
      justify-content: center;
      gap: 1.2rem;
      width: 100%;
    }

    .eyebrow,
    #status {
      display: none;
    }

    .col-presets {
      flex-direction: column;
      margin-top: 0;
      gap: 0.6rem;
      order: 1;
    }

    .col-center {
      order: 2;
    }

    .col-right {
      flex-direction: column;
      margin-top: 0;
      gap: 0.6rem;
      order: 3;
      width: 120px;
    }

    .col-right .inputs {
      margin-bottom: 0.3rem;
    }

    .col-right .button-row {
      flex-direction: column;
      width: 100%;
    }

    .col-presets button {
      padding: 0.2rem 0.9rem;
      font-size: 0.85rem;
    }

    .col-right button {
      padding: 0.4rem 0.8rem;
      font-size: 0.85rem;
    }

    .col-right .inputs {
      gap: 0.5rem;
    }

    .col-right input[type="number"] {
      width: 48px;
      padding: 0.4rem;
      font-size: 1rem;
    }

    .col-right button {
      width: 100%;
    }

    .timer-wrap {
      width: min(320px, 80vh, 40vw);
      height: min(320px, 80vh, 40vw);
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .ring-progress { transition: none; }
    #display.pulse { animation: none; }
  }

  /* --- 追加: バータイマー画面 --- */
  .bar-view {
    position: fixed;
    inset: 0;
    z-index: 200;
    display: none;
    justify-content: flex-end;
    align-items: flex-end;
    background: var(--bg);
    padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
  }
  .bar-view.show { display: flex; }

  .bar-main { width: 100%; max-width: 880px; padding: 24px 40px 20px; }

  .bar-head {
    display: flex;
    justify-content: flex-end;
    align-items: stretch;
    gap: 16px;
    margin-bottom: 16px;
  }

  .bar-time {
    font-family: 'Space Grotesk', sans-serif;
    font-size: clamp(40px, 5.2vw, 84px);
    font-weight: 700;
    line-height: 1;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.02em;
  }
  .bar-time.done { color: var(--teal); }

  .bar-track {
    height: clamp(50px, 11vh, 110px);
    background: var(--ring-track);
    border-radius: 10px;
    overflow: hidden;
    position: relative;
  }
  /* バーは右から左へ進む */
  .bar-fill {
    position: absolute;
    inset: 0 0 0 auto;
    width: 0%;
    background: var(--amber);
    transition: background-color 0.6s;
  }
  .bar-ticks { position: absolute; inset: 0; display: flex; pointer-events: none; }
  .bar-ticks i { flex: 1; border-right: 1px solid var(--bg); }
  .bar-ticks i.m5 { border-right-width: 3px; }
  .bar-ticks i:last-child { border-right: 0; }
  .bar-track.flash .bar-fill { animation: barFlash 0.5s steps(2) infinite; }
  @keyframes barFlash { 50% { opacity: 0.25; } }

  #barMainBtn {
    flex: 0 0 auto;
    width: clamp(34px, 4vw, 56px);
    padding: 0;
    border-radius: 8px;
    background: var(--amber);
    color: #1a1206;
  }
  #barMainBtn.stop { background: var(--teal); color: #06231a; }
  #barMainBtn:focus-visible, #barBackBtn:focus-visible { outline: 3px solid var(--amber); outline-offset: 3px; }

  #barBackBtn {
    position: absolute;
    top: calc(16px + env(safe-area-inset-top, 0px));
    left: 16px;
    padding: 0.5rem 1rem;
    font-size: 0.8rem;
    background: transparent;
    color: var(--text-dim);
    border: 1px solid #232a3a;
  }
  #barBackBtn:hover { color: var(--text); border-color: #3a4256; }

  /* 猫と足跡 */
  .bar-lane { position: relative; height: 46px; margin-top: 4px; --r: 1; pointer-events: none; }
  .bar-cat, .bar-fish, .bar-owl {
    position: absolute;
    bottom: 0;
    width: 76px;
    left: calc((100% - 76px) * var(--r));
    transition: left 0.2s linear;
  }
  .bar-cat svg { display: block; overflow: visible; animation: barBob 0.35s ease-in-out infinite; animation-play-state: paused; }
  @keyframes barBob { 50% { transform: translateY(-1.5px); } }
  .bar-cat .o { stroke: #8a93a6; stroke-width: 2; stroke-linejoin: round; }
  .bar-cat .w { fill: #fff; }
  .bar-cat .far { fill: #cfd5df; }
  .bar-cat .tl-o { fill: none; stroke: #8a93a6; stroke-width: 8; stroke-linecap: round; }
  .bar-cat .tl { fill: none; stroke: #fff; stroke-width: 4.5; stroke-linecap: round; }
  .bar-cat .leg {
    transform-box: fill-box;
    transform-origin: 50% 0;
    animation: barStepA 0.7s ease-in-out infinite alternate;
    animation-play-state: paused;
  }
  .bar-cat .leg.b { animation-name: barStepB; }
  @keyframes barStepA { from { transform: rotate(-26deg); } to { transform: rotate(26deg); } }
  @keyframes barStepB { from { transform: rotate(26deg); } to { transform: rotate(-26deg); } }
  .bar-cat .tail {
    transform-box: fill-box;
    transform-origin: 0% 100%;
    animation: barSway 1.4s ease-in-out infinite alternate;
    animation-play-state: paused;
  }
  @keyframes barSway { from { transform: rotate(-5deg); } to { transform: rotate(7deg); } }
  .bar-view.running .bar-cat svg,
  .bar-view.running .bar-cat .leg,
  .bar-view.running .bar-cat .tail { animation-play-state: running; }

  /* 魚: 尾を振りながら、少し上下に揺れて泳ぐ */
  .bar-fish svg, .bar-owl svg { display: block; overflow: visible; animation-play-state: paused; }
  .bar-fish svg { animation: fishWave 0.5s ease-in-out infinite alternate; animation-play-state: paused; }
  @keyframes fishWave { from { transform: translateY(-2px); } to { transform: translateY(2px); } }
  .bar-fish .o, .bar-owl .o { stroke: #8a93a6; stroke-width: 2; stroke-linejoin: round; }
  .bar-fish .w, .bar-owl .w { fill: #fff; }
  .bar-owl .far { fill: #cfd5df; }
  .bar-fish .ftail {
    transform-box: fill-box;
    transform-origin: 100% 50%;
    animation: fishTail 0.35s ease-in-out infinite alternate;
    animation-play-state: paused;
  }
  @keyframes fishTail { from { transform: rotate(-14deg); } to { transform: rotate(14deg); } }

  /* フクロウ: ぴょんぴょん跳ねながら進む */
  .bar-owl svg { animation: owlHop 0.6s ease-in-out infinite; animation-play-state: paused; }
  @keyframes owlHop { 50% { transform: translateY(-4px); } }
  .bar-owl .leg {
    transform-box: fill-box;
    transform-origin: 50% 0;
    animation: barStepA 0.6s ease-in-out infinite alternate;
    animation-play-state: paused;
  }
  .bar-owl .leg.b { animation-name: barStepB; }
  .bar-owl .wing {
    transform-box: fill-box;
    transform-origin: 50% 0;
    animation: owlWing 0.6s ease-in-out infinite alternate;
    animation-play-state: paused;
  }
  @keyframes owlWing { from { transform: rotate(-6deg); } to { transform: rotate(8deg); } }

  .bar-view.running .bar-fish svg,
  .bar-view.running .bar-fish .ftail,
  .bar-view.running .bar-owl svg,
  .bar-view.running .bar-owl .leg,
  .bar-view.running .bar-owl .wing { animation-play-state: running; }

  .bar-paw {
    position: absolute;
    width: 12px;
    height: 12px;
    color: var(--text-dim);
    opacity: 0.4;
    animation: barPawIn 0.4s ease-out;
  }
  .bar-paw svg { display: block; width: 100%; height: 100%; fill: currentColor; transform: rotate(-90deg); }
  @keyframes barPawIn { from { opacity: 0; } to { opacity: 0.4; } }

  @media (prefers-reduced-motion: reduce) {
    .bar-fill { transition: none; }
    .bar-cat, .bar-fish, .bar-owl { transition: none; }
    .bar-track.flash .bar-fill,
    .bar-cat svg, .bar-cat .leg, .bar-cat .tail, .bar-paw,
    .bar-fish svg, .bar-fish .ftail,
    .bar-owl svg, .bar-owl .leg, .bar-owl .wing { animation: none; }
  }
  /* --- 追加ここまで(バータイマー) --- */

  /* --- 追加: 右上メニュー(画面の色) --- */
  #menuBtn {
    position: fixed;
    top: calc(12px + env(safe-area-inset-top, 0px));
    right: calc(12px + env(safe-area-inset-right, 0px));
    z-index: 300;
    width: 40px;
    height: 40px;
    padding: 0;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg-soft);
    color: var(--text-dim);
    border: 1px solid #232a3a;
  }
  #menuBtn:hover { color: var(--text); border-color: #3a4256; }
  #menuBtn:focus-visible, .swatch:focus-visible { outline: 3px solid var(--amber); outline-offset: 3px; }
  #menuBtn svg { width: 18px; height: 18px; display: block; }
  /* 5秒間タップがないとメニューボタンを隠す(タップで再表示) */
  #menuBtn { transition: opacity 0.4s ease; }
  #menuBtn.faded {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transition: opacity 0.4s ease, visibility 0s linear 0.4s;
  }
  @media (prefers-reduced-motion: reduce) {
    #menuBtn, #menuBtn.faded { transition: none; }
  }

  #menuPanel {
    position: fixed;
    top: calc(60px + env(safe-area-inset-top, 0px));
    right: calc(12px + env(safe-area-inset-right, 0px));
    z-index: 300;
    min-width: 180px;
    max-height: calc(100vh - 80px);
    overflow-y: auto;
    padding: 0.9rem;
    background: var(--bg-soft);
    border: 1px solid #232a3a;
    border-radius: 14px;
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.45);
  }
  #menuPanel[hidden] { display: none; }

  .menu-title {
    margin: 0 0 0.7rem;
    font-size: 0.75rem;
    letter-spacing: 0.1em;
    color: var(--text-dim);
  }

  .swatch {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    width: 100%;
    padding: 0.55rem 0.8rem;
    border-radius: 10px;
    background: transparent;
    color: var(--text-dim);
    border: 1px solid #232a3a;
    font-size: 0.85rem;
    font-weight: 500;
    text-align: left;
  }
  .swatch + .swatch { margin-top: 0.5rem; }
  .swatch:hover { color: var(--text); }
  .swatch[aria-pressed="true"] { color: var(--text); border-color: var(--amber); }
  .swatch i {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    flex: 0 0 auto;
    border: 1px solid rgba(255, 255, 255, 0.25);
  }
  .menu-title.sub { margin-top: 1rem; }

  /* ステータス文が空のときは場所も取らない */
  #status:empty { display: none; }

  /* キャラクターの切り替え(猫 / 魚 / フクロウ / なし) */
  .bar-fish, .bar-owl { display: none; }
  :root[data-char="fish"] .bar-cat,
  :root[data-char="owl"] .bar-cat { display: none; }
  :root[data-char="fish"] .bar-fish,
  :root[data-char="owl"] .bar-owl { display: block; }
  :root[data-char="off"] .bar-lane { display: none; }
  /* --- 追加ここまで(メニュー) --- */

  /* --- ここから追加: 終了時のポップアップ --- */
  .popup-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.6);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 250;
  }

  .popup-overlay.show {
    display: flex;
  }

  .popup-box {
    background: var(--bg-soft);
    border: 1px solid var(--teal);
    border-radius: 16px;
    padding: 2rem 2.5rem;
    text-align: center;
    box-shadow: 0 0 40px rgba(61, 220, 151, 0.35);
    animation: popIn 0.25s ease;
    max-width: 80vw;
  }

  @keyframes popIn {
    from { transform: scale(0.85); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }

  .popup-box p {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 1.3rem;
    margin: 0 0 1.4rem;
    color: var(--teal);
  }

  .popup-box button {
    background: var(--teal);
    color: #06231a;
  }
  /* --- 追加ここまで --- */
</style>
</head>
<body>

  <div class="layout">

    <div class="col col-presets">
      <button class="preset active" data-min="25" aria-label="25分">25</button>
      <button class="preset" data-min="5" aria-label="5分">5</button>
      <button class="preset" data-min="3" aria-label="3分">3</button>
      <button class="preset" data-min="1" aria-label="1分">1</button>
    </div>

    <div class="col col-center">
      <div class="eyebrow">FOCUS TIMER</div>
      <div class="timer-wrap">
        <svg class="ring" width="320" height="320" viewBox="0 0 320 320">
          <circle class="ring-track" cx="160" cy="160" r="148"></circle>
          <circle id="ringProgress" class="ring-progress" cx="160" cy="160" r="148"></circle>
        </svg>
        <div id="display">25:00</div>
      </div>
      <div id="status"></div>
    </div>

    <div class="col col-right">
      <div class="inputs">
        <div class="field">
          <label>分</label>
          <input type="number" id="minutes" value="25" min="0" max="999">
        </div>
        <div class="field">
          <label>秒</label>
          <input type="number" id="seconds" value="0" min="0" max="59">
        </div>
      </div>
      <div class="button-row">
        <button id="startBtn">開始</button>
      </div>
      <button id="barOpenBtn" type="button">バータイマー</button>
    </div>

  </div>

  <!-- 追加: バータイマー画面 -->
  <div class="bar-view" id="barView" role="dialog" aria-label="バータイマー">
    <button id="barBackBtn" type="button" aria-label="戻る">◀︎</button>
    <div class="bar-main">
      <div class="bar-head">
        <div class="bar-time" id="barTime">25:00</div>
        <button id="barMainBtn" type="button" aria-label="スタート"></button>
      </div>
      <div class="bar-track" id="barTrack" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div class="bar-fill" id="barFill"></div>
        <div class="bar-ticks" id="barTicks"></div>
      </div>
      <div class="bar-lane" id="barLane" aria-hidden="true">
        <div class="bar-cat" id="barCat">
          <svg viewBox="0 0 124 72" width="76" height="44">
            <g transform="translate(124,0) scale(-1,1)">
              <g transform="translate(40,44)"><g class="leg b"><rect class="o far" x="-4" y="0" width="8" height="24" rx="2"/></g></g>

<script>
const CIRC = 2 * Math.PI * 148;

let totalSeconds = 0;
let remaining = 0;
let timerId = null;
let isPaused = false;

const display = document.getElementById('display');
const status = document.getElementById('status');
const minutesInput = document.getElementById('minutes');
const secondsInput = document.getElementById('seconds');
const startBtn = document.getElementById('startBtn');
const ring = document.getElementById('ringProgress');
const presetBtns = document.querySelectorAll('.preset');

// 追加: ポップアップ関連の要素と関数
const popupOverlay = document.getElementById('popupOverlay');
const popupCloseBtn = document.getElementById('popupCloseBtn');

function showPopup() {
  popupOverlay.classList.add('show');
}

function hidePopup() {
  popupOverlay.classList.remove('show');
  stopAlarmSound(); // ポップアップを閉じたらアラーム音も止める
}

popupCloseBtn.addEventListener('click', hidePopup);
popupOverlay.addEventListener('click', (e) => {
  if (e.target === popupOverlay) hidePopup();
});

// スマホ(特にiOS Safari)は「ユーザー操作の直後」に作られた音声出口以外は鳴らないことが多いので、
// AudioContextはここで1つだけ作り、ボタン操作のタイミングで起動(resume)しておく
let audioCtx = null;
function ensureAudioUnlocked() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
  unlockAlarmSound();
}

function unlockAlarmSound() {
  if (alarmUnlocked) return;
  alarmUnlocked = true;
  alarmAudio.muted = true;
  const done = () => { alarmAudio.pause(); alarmAudio.currentTime = 0; alarmAudio.muted = false; };
  try {
    const p = alarmAudio.play();
    if (p && p.then) p.then(done).catch(() => { alarmAudio.muted = false; });
    else done();
  } catch (e) { alarmAudio.muted = false; }
}

function startAlarmSound() {
  alarmAudio.muted = false;
  alarmAudio.currentTime = 0;
  const p = alarmAudio.play();
  if (p && p.catch) p.catch(() => playBeep());
  clearTimeout(alarmSoundTimer);
  alarmSoundTimer = setTimeout(stopAlarmSound, 120000);
}

function stopAlarmSound() {
  clearTimeout(alarmSoundTimer);
  alarmAudio.pause();
  alarmAudio.currentTime = 0;
}

presetBtns.forEach(btn => {
  btn.addEventListener('click', () => {
    ensureAudioUnlocked();

    presetBtns.forEach(b => b.classList.remove('active'));
    btn.classList.add('active');

    // 動作中・一時停止中なら一度止めてリセットしてから新しい時間を設定
    clearInterval(timerId);
    timerId = null;
    isPaused = false;

    minutesInput.value = btn.dataset.min;
    secondsInput.value = 0;
    ring.classList.remove('done');
    display.classList.remove('pulse');
    hidePopup();

    totalSeconds = parseInt(btn.dataset.min, 10) * 60;
    remaining = totalSeconds;
    updateDisplay();

    status.textContent = 'カウントダウン中';
    timerId = setInterval(tick, 1000);
    syncStartBtn();
  });
});

// 手動入力したらプリセットの選択状態を解除
// また、プリセット選択によってタイマーが動作中だった場合はここで止めておく。
// こうしないと「開始」を押したときに timerId が残っていて無視されてしまい、
// リセットしないと手入力の時間が反映されない、という問題が起きる。
[minutesInput, secondsInput].forEach(input => {
  input.addEventListener('input', () => {
    presetBtns.forEach(b => b.classList.remove('active'));

    if (timerId) {
      clearInterval(timerId);
      timerId = null;
    }
    isPaused = false;
    syncStartBtn();
  });
});

ring.style.strokeDasharray = `${CIRC}`;
ring.style.strokeDashoffset = `0`;

// 初期値(分・秒の入力欄の値)を反映しておく。これがないと起動直後の表示が
// 00:00 になってしまい、入力欄のデフォルト値(25分)と表示がズレてしまう。
totalSeconds = (parseInt(minutesInput.value, 10) || 0) * 60 + (parseInt(secondsInput.value, 10) || 0);
remaining = totalSeconds;

function formatTime(sec) {
  const m = Math.floor(sec / 60).toString().padStart(2, '0');
  const s = (sec % 60).toString().padStart(2, '0');
  return `${m}:${s}`;
}

function updateDisplay() {
  display.textContent = formatTime(remaining);
  if (totalSeconds > 0) {
    const progress = remaining / totalSeconds;
    ring.style.strokeDashoffset = `${CIRC * (1 - progress)}`;
  }
}

function playBeep() {
  ensureAudioUnlocked();
  const ctx = audioCtx;

  // ベルのような音:基音+倍音をいくつか重ねて、すぐ立ち上がってゆっくり減衰させる
  const playBell = (delay, baseFreq, volume) => {
    const partials = [1, 2.4, 3.8, 5.2]; // 倍音の比率(ベルらしい非整数倍音)
    const gains = [1, 0.5, 0.25, 0.12];

    partials.forEach((ratio, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = baseFreq * ratio;
      osc.connect(gain);
      gain.connect(ctx.destination);

      const start = ctx.currentTime + delay;
      const peak = volume * gains[i];
      gain.gain.setValueAtTime(0, start);
      gain.gain.linearRampToValueAtTime(peak, start + 0.01); // 一瞬で立ち上がる
      gain.gain.exponentialRampToValueAtTime(0.001, start + 2.2); // ゆっくり減衰

      osc.start(start);
      osc.stop(start + 2.2);
    });
  };

  // チリンチリンと5秒間鳴らす(音高を少しずつ変えながら、間隔を空けて連打)
  const pitches = [1320, 1568, 1480, 1760, 1320, 1568];
  const startTimes = [0, 0.3, 1.2, 1.7, 3.0, 3.6]; // 5秒以内に収まる打鍵タイミング
  startTimes.forEach((t, i) => {
    playBell(t, pitches[i], 0.22 - i * 0.015);
  });
}

function finish() {
  clearInterval(timerId);
  timerId = null;
  syncStartBtn();
  status.textContent = '時間になりました';
  ring.classList.add('done');
  display.classList.add('pulse');
  startAlarmSound();
  showPopup(); // 追加: 終了時に画面中央へポップアップを表示
}

function tick() {
  if (remaining <= 0) {
    finish();
    return;
  }
  remaining--;
  updateDisplay();
  if (remaining <= 0) finish();
}

// 開始ボタンは、状態に応じて「開始 → 一時停止 → 再開」と切り替わる
function syncStartBtn() {
  startBtn.textContent = timerId ? '一時停止' : isPaused ? '再開' : '開始';
}

function pauseTimer() {
  if (!timerId) return;
  clearInterval(timerId);
  timerId = null;
  isPaused = true;
  status.textContent = '一時停止中';
  syncStartBtn();
}

startBtn.addEventListener('click', () => {
  ensureAudioUnlocked();
  if (timerId) { pauseTimer(); return; } // 動いている間に押すと一時停止

  if (!isPaused) {
    const m = parseInt(minutesInput.value, 10) || 0;
    const s = parseInt(secondsInput.value, 10) || 0;
    totalSeconds = m * 60 + s;
    remaining = totalSeconds;
    ring.classList.remove('done');
    display.classList.remove('pulse');
    hidePopup();
  }

  if (remaining <= 0) {
    status.textContent = '時間を入力してください';
    return;
  }

  isPaused = false;
  status.textContent = 'カウントダウン中';
  updateDisplay();
  timerId = setInterval(tick, 1000);
  syncStartBtn();
});

updateDisplay();

// ===== 追加: バータイマー画面 =====
// 分・秒の入力欄に入っている時間(0なら25分)でバータイマーを開く。
// バーは右から左へ進み、猫が同じ向きに歩いて足跡を残す。
(function () {
  const view = document.getElementById('barView');
  const layout = document.querySelector('.layout');
  const openBtn = document.getElementById('barOpenBtn');
  const backBtn = document.getElementById('barBackBtn');
  const timeEl = document.getElementById('barTime');
  const fillEl = document.getElementById('barFill');
  const trackEl = document.getElementById('barTrack');
  const ticksEl = document.getElementById('barTicks');
  const mainBtn = document.getElementById('barMainBtn');
  const lane = document.getElementById('barLane');
  const catEl = document.getElementById('barCat');

  const PAWS = 28; // 足跡の数(全体で)
  const PAW_SVG = '<svg viewBox="0 0 12 12" aria-hidden="true"><ellipse cx="6" cy="8.3" rx="3.3" ry="2.7"/><circle cx="2.2" cy="5" r="1.5"/><circle cx="4.6" cy="2.6" r="1.5"/><circle cx="7.4" cy="2.6" r="1.5"/><circle cx="9.8" cy="5" r="1.5"/></svg>';

  // キャラごとの足跡: 猫=肉球 / フクロウ=鳥の足跡 / 魚=泡
  const BIRD_SVG = '<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M6 10.5V3M6 7L2 3.5M6 7l4-3.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>';
  const BUBBLE_SVG = '<svg viewBox="0 0 12 12" aria-hidden="true"><circle cx="6" cy="6" r="4" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>';
  const MARKS = {
    cat:  { svg: PAW_SVG,    x: 32, b: [10, 0] },
    owl:  { svg: BIRD_SVG,   x: 32, b: [10, 0] },
    fish: { svg: BUBBLE_SVG, x: 44, b: [26, 14] }
  };
  function currentMark() {
    return MARKS[document.documentElement.getAttribute('data-char')] || MARKS.cat;
  }

  let total = 0;          // ms
  let remaining = 0;      // ms
  let endAt = 0;
  let state = 'idle';     // idle / running / paused / done
  let timer = null, alarmTimer = null, alarmStop = null, endTimer = null;
  let paws = [];

  function fmt(ms) {
    const s = Math.ceil(ms / 1000);
    const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60;
    const p = n => String(n).padStart(2, '0');
    return h > 0 ? `${h}:${p(m)}:${p(x)}` : `${p(m)}:${p(x)}`;
  }

  function buildTicks() {
    ticksEl.innerHTML = '';
    const sec = total / 1000;
    const unit = sec <= 300 ? 10 : sec <= 3600 ? 60 : 300;       // 目盛り1本ぶんの秒数
    const emph = unit === 10 ? 6 : unit === 60 ? 5 : 12;          // 太い目盛りの間隔
    const n = Math.min(120, Math.max(1, Math.round(sec / unit)));
    for (let i = 1; i <= n; i++) {
      const t = document.createElement('i');
      if (i % emph === 0) t.className = 'm5';
      ticksEl.appendChild(t);
    }
  }

  function syncPaws(n) {
    while (paws.length > n) paws.pop().remove();
    while (paws.length < n) {
      const i = paws.length + 1;
      const el = document.createElement('i');
      el.className = 'bar-paw';
      const m = currentMark();
      el.style.left = `calc((100% - 76px) * ${1 - i / PAWS} + ${m.x}px)`;
      el.style.bottom = (i % 2 ? m.b[1] : m.b[0]) + 'px';
      el.innerHTML = m.svg;
      lane.insertBefore(el, catEl);
      paws.push(el);
    }
  }

  function render() {
    const r = remaining / total;
    const pct = Math.min(100, (1 - r) * 100);
    timeEl.textContent = fmt(remaining);
    timeEl.classList.toggle('done', state === 'done');
    view.classList.toggle('running', state === 'running');
    fillEl.style.width = pct + '%';
    trackEl.setAttribute('aria-valuenow', Math.round(pct));
    lane.style.setProperty('--r', r);
    syncPaws(state === 'idle' ? 0 : Math.floor((1 - r) * PAWS));
    mainBtn.setAttribute('aria-label', { idle: 'スタート', running: '一時停止', paused: '再開', done: 'アラームを止める' }[state]);
    mainBtn.classList.toggle('stop', state === 'done');
  }

  function tick() {
    if (state !== 'running') return;
    remaining = Math.max(0, endAt - Date.now());
    if (remaining <= 0) { finish(); return; }
    render();
  }

  function start() {
    ensureAudioUnlocked();
    if (state === 'idle') remaining = total;
    endAt = Date.now() + remaining;
    state = 'running';
    clearInterval(timer);
    timer = setInterval(tick, 200);
    // 別タブにいてもぴったり終わるように、終了時刻にも1回だけタイマーを仕掛けておく
    clearTimeout(endTimer);
    endTimer = setTimeout(tick, remaining + 20);
    askNotify();
    render();
  }

  function pause() {
    remaining = Math.max(0, endAt - Date.now());
    clearInterval(timer);
    clearTimeout(endTimer);
    state = 'paused';
    render();
  }

  function startAlarm() {
    startAlarmSound();
    clearTimeout(alarmStop);
    alarmStop = setTimeout(stopAlarm, 120000);
  }

  function stopAlarm() {
    clearTimeout(alarmStop);
    stopAlarmSound();
    trackEl.classList.remove('flash');
  }

  // 「25分」「1分30秒」のような表記にする
  function durationText(ms) {
    const sec = Math.round(ms / 1000);
    const m = Math.floor(sec / 60), s = sec % 60;
    return (m ? `${m}分` : '') + (s || !m ? `${s}秒` : '');
  }

  // 新しいウィンドウに出す中身
  function alertHtml() {
    return `<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><title>時間がきたよ！</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=Inter:wght@500;600&display=swap" rel="stylesheet">
<style>
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0b0e14;color:#3ddc97;text-align:center;font-family:'Inter',sans-serif}
.t{margin:0 0 .5rem;font-family:'Space Grotesk',sans-serif;font-size:1.7rem;font-weight:700}
.s{margin:0 0 1.2rem;color:#6b7280;font-size:.95rem}
button{padding:.7rem 1.8rem;border:0;border-radius:999px;background:#3ddc97;color:#06231a;font:600 .95rem 'Inter',sans-serif;cursor:pointer}
</style></head><body>
<p class="t">⏰ 時間がきたよ！</p>
<p class="s">${durationText(total)}が経過しました</p>
<button onclick="window.close()">閉じる</button>
</body></html>`;
  }

  // 時間が来たら、パソコンの画面に新しいウィンドウを開く。
  // ブラウザにブロックされて開けなかったら false を返す。
  let alertWin = null, alertWatch = null;

  function openAlertWindow() {
    const W = 380, H = 240;
    // ブラウザのウィンドウではなく、ディスプレイ(作業領域)の中央に置く
    const scr = window.screen;
    const sx = scr.availLeft ?? scr.left ?? 0;
    const sy = scr.availTop ?? scr.top ?? 0;
    const sw = scr.availWidth || scr.width;
    const sh = scr.availHeight || scr.height;
    const left = Math.round(sx + (sw - W) / 2);
    const top = Math.round(sy + (sh - H) / 2);
    let w = null;
    try {
      w = window.open('', 'focusTimerAlert', `popup=yes,width=${W},height=${H},left=${left},top=${top}`);
    } catch (e) {}
    if (!w || w.closed) return false;
    try {
      w.document.open();
      w.document.write(alertHtml());
      w.document.close();
      w.focus();
    } catch (e) { return false; }
    alertWin = w;
    clearInterval(alertWatch);
    alertWatch = setInterval(() => {
      if (!alertWin || alertWin.closed) {
        clearInterval(alertWatch);
        alertWin = null;
        if (state === 'done') stopAlarm(); // ウィンドウを閉じたらアラームと点滅も止める
      }
    }, 500);
    return true;
  }

  function closeAlertWindow() {
    clearInterval(alertWatch);
    if (alertWin && !alertWin.closed) alertWin.close();
    alertWin = null;
  }

  // デスクトップ通知の許可を、最初のスタート操作のときに1回だけ確認する
  function askNotify() {
    try {
      if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission();
    } catch (e) {}
  }

  // 通知(許可されている場合のみ)。ウィンドウを最小化していて新しいウィンドウが前に出ないときの保険。
  function notifyDone() {
    try {
      if ('Notification' in window && Notification.permission === 'granted') {
        const n = new Notification('⏰ 時間がきたよ！', {
          body: `${durationText(total)}が経過しました`,
          tag: 'focus-timer',
          requireInteraction: true
        });
        n.onclick = () => { window.focus(); if (alertWin && !alertWin.closed) alertWin.focus(); n.close(); };
      }
    } catch (e) {}
  }

  function finish() {
    clearInterval(timer);
    clearTimeout(endTimer);
    remaining = 0;
    state = 'done';
    trackEl.classList.add('flash');
    startAlarm();
    // 新しいウィンドウを開く。ブロックされたときだけ画面内ポップアップで代用する。
    // 通知は、最小化中などでウィンドウが前に出ない場合の保険として、どちらの場合でも出す。
    if (!openAlertWindow()) showPopup();
    notifyDone();
    render();
  }

  mainBtn.addEventListener('click', () => {
    if (state === 'idle' || state === 'paused') start();
    else if (state === 'running') pause();
    else { stopAlarm(); hidePopup(); closeAlertWindow(); state = 'idle'; remaining = total; render(); }
  });

  function open() {
    ensureAudioUnlocked();
    pauseTimer(); // リング側が動いていたら止めておく
    const m = parseInt(minutesInput.value, 10) || 0;
    const s = parseInt(secondsInput.value, 10) || 0;
    total = ((m * 60 + s) || 25 * 60) * 1000;
    remaining = total;
    state = 'idle';
    buildTicks();
    view.classList.add('show');
    layout.inert = true;
    render();
    mainBtn.focus();
  }

  function close() {
    clearInterval(timer);
    clearTimeout(endTimer);
    stopAlarm();
    hidePopup();
    closeAlertWindow();
    state = 'idle';
    view.classList.remove('show', 'running');
    layout.inert = false;
    openBtn.focus();
  }

  // キャラクターを切り替えたら、足跡を作り直す
  document.addEventListener('charchange', () => {
    syncPaws(0);
    if (view.classList.contains('show')) render();
  });

  openBtn.addEventListener('click', open);
  backBtn.addEventListener('click', close);
  // ポップアップを閉じたらアラーム音と点滅も止める
  popupCloseBtn.addEventListener('click', () => { if (state === 'done') stopAlarm(); });
  popupOverlay.addEventListener('click', (e) => { if (e.target === popupOverlay && state === 'done') stopAlarm(); });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && view.classList.contains('show')) close();
  });
  document.addEventListener('visibilitychange', () => {
    if (state === 'running') tick();
  });
})();

// ===== 追加: 右上メニュー(画面の色) =====
(function () {
  const menuBtn = document.getElementById('menuBtn');
  const panel = document.getElementById('menuPanel');
  const swatches = panel.querySelectorAll('[data-accent]');
  const KEY = 'focusTimerAccent';

  function applyAccent(name) {
    if (name === 'white') document.documentElement.setAttribute('data-accent', 'white');
    else document.documentElement.removeAttribute('data-accent');
    swatches.forEach(b => b.setAttribute('aria-pressed', String(b.dataset.accent === name)));
  }

  function setMenu(open) {
    panel.hidden = !open;
    menuBtn.setAttribute('aria-expanded', String(open));
    showMenuBtn();
  }

  let saved = 'orange';
  try { saved = localStorage.getItem(KEY) === 'white' ? 'white' : 'orange'; } catch (e) {}
  applyAccent(saved);

  swatches.forEach(b => b.addEventListener('click', () => {
    applyAccent(b.dataset.accent);
    try { localStorage.setItem(KEY, b.dataset.accent); } catch (e) {}
  }));

  // バータイマー画面のキャラクター(猫・魚・フクロウ・なし)
  const charBtns = panel.querySelectorAll('[data-char]');
  const CHAR_KEY = 'focusTimerChar';
  const CHARS = ['cat', 'fish', 'owl', 'off'];

  function applyChar(v) {
    document.documentElement.setAttribute('data-char', v);
    charBtns.forEach(b => b.setAttribute('aria-pressed', String(b.dataset.char === v)));
    document.dispatchEvent(new CustomEvent('charchange'));
  }

  let savedChar = 'off'; // 初期状態はキャラクターなし
  try {
    const v = localStorage.getItem(CHAR_KEY);
    if (CHARS.includes(v)) savedChar = v;
    else if (localStorage.getItem('focusTimerCat') === 'off') savedChar = 'off'; // 以前の「猫なし」設定を引き継ぐ
  } catch (e) {}
  applyChar(savedChar);

  charBtns.forEach(b => b.addEventListener('click', () => {
    applyChar(b.dataset.char);
    try { localStorage.setItem(CHAR_KEY, b.dataset.char); } catch (e) {}
  }));

  // 5秒間タップ(や操作)がなかったらメニューボタンを隠す。画面をタップすると再表示。
  // メニューを開いている間は隠さない。
  const HIDE_MS = 5000;
  let hideTimer = null;

  function showMenuBtn() {
    menuBtn.classList.remove('faded');
    clearTimeout(hideTimer);
    if (panel.hidden) {
      hideTimer = setTimeout(() => menuBtn.classList.add('faded'), HIDE_MS);
    }
  }

  document.addEventListener('pointerdown', showMenuBtn, true);
  document.addEventListener('keydown', showMenuBtn, true);
  showMenuBtn();

  menuBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    setMenu(panel.hidden);
  });
  document.addEventListener('click', (e) => {
    if (!panel.hidden && !panel.contains(e.target)) setMenu(false);
  });
  // メニューを開いているときのEscはメニューだけ閉じる(バー画面は閉じない)
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && !panel.hidden) {
      e.stopPropagation();
      setMenu(false);
      menuBtn.focus();
    }
  }, true);
})();
</script>
